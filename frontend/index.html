<!DOCTYPE html>
<html>

<head>

<title>Internet Rabbit Hole Galaxy</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0b0b0b;
color:white;
}

/* FIXED TOP BAR */
#controls{
position:fixed;
top:0;
width:100%;
background:black;
padding:15px;
z-index:9999;
text-align:center;
}

/* PATH */
#path{
margin-top:10px;
font-size:18px;
color:#00ffcc;
font-weight:bold;
}

/* PREDICTION */
#prediction{
margin-top:5px;
font-size:16px;
color:#ffd700;
}

/* GRAPH AREA */
#graph{
position:absolute;
top:140px;
width:100vw;
height:calc(100vh - 140px);
}

input{
padding:10px;
font-size:16px;
width:250px;
}

button{
padding:10px 15px;
font-size:16px;
cursor:pointer;
}

</style>

</head>

<body>

<div id="controls">

<h2>Internet Rabbit Hole Galaxy 🚀</h2>

<input id="topicInput" placeholder="Enter topic">
<button onclick="startSearch()">Explore</button>

<div id="path">Path: (start exploring)</div>
<div id="prediction">Prediction: ...</div>

</div>

<div id="graph"></div>

<script src="https://unpkg.com/3d-force-graph"></script>
<script src="script.js"></script>

</body>

</html>
